user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    upstream dify_web {
        server dify-web:3000;
    }

    upstream dify_api {
        server dify-api:5001;
    }

    upstream dify_plugin {
        server plugin_daemon:5002;
    }

    # Ajustes compartidos para el proxy hacia la API (streaming SSE incluido).
    # proxy_buffering off es clave para las respuestas en streaming del chat.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        location /health {
            access_log off;
            return 200 "healthy";
            add_header Content-Type text/plain;
        }

        # --- Rutas de la API de Dify 1.x (todas van a dify-api) ---
        # Se preserva el path completo (proxy_pass SIN slash final ni URI).
        location /console/api {
            proxy_pass http://dify_api;
            include /etc/nginx/dify_proxy.conf;
        }

        location /api {
            proxy_pass http://dify_api;
            include /etc/nginx/dify_proxy.conf;
        }

        location /v1 {
            proxy_pass http://dify_api;
            include /etc/nginx/dify_proxy.conf;
        }

        location /openapi {
            proxy_pass http://dify_api;
            include /etc/nginx/dify_proxy.conf;
        }

        location /files {
            proxy_pass http://dify_api;
            include /etc/nginx/dify_proxy.conf;
        }

        location /mcp {
            proxy_pass http://dify_api;
            include /etc/nginx/dify_proxy.conf;
        }

        location /triggers {
            proxy_pass http://dify_api;
            include /etc/nginx/dify_proxy.conf;
        }

        # Endpoints (webhooks) de plugins -> plugin_daemon
        location /e/ {
            proxy_pass http://dify_plugin;
            proxy_set_header Dify-Hook-Url $scheme://$host$request_uri;
            include /etc/nginx/dify_proxy.conf;
        }

        # WebSocket / socket.io
        location /socket.io/ {
            proxy_pass http://dify_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # --- Frontend (Next.js) ---
        location /explore {
            proxy_pass http://dify_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://dify_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}