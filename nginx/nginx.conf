user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # rate=10r/s burst=20 rechazaba con 503 el burst de ~25-30 llamadas
    # que el editor de workflows dispara al cargar (/console/api/*) —
    # el editor queda trabado en "Syncing data" para siempre porque
    # algunas de esas llamadas (system-variables, conversation-variables)
    # son necesarias para que se considere "sincronizado". Ver
    # docs/TROUBLESHOOTING.md.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Detrás de Traefik (Dokploy), nginx solo recibe HTTP plano de Traefik
    # (TLS termina ahí) — pero Traefik SÍ manda X-Forwarded-Proto: https en
    # ese request. Si acá usáramos "$scheme" a secas (la conexión que nginx
    # recibe, siempre http en ese caso) pisaríamos ese header con "http" al
    # reenviarlo a dify-api/dify-web, y la app nunca sabría (vía
    # RESPECT_XFORWARD_HEADERS_ENABLED, ver docker-compose.yml) que la
    # conexión real del navegador es HTTPS. Esto NO es la causa del bug de
    # login "CSRF token is missing or invalid" (esa es un mismatch de nombre
    # de cookie, ver docs/TROUBLESHOOTING.md) — es una corrección general de
    # reverse-proxy-detrás-de-otro-proxy, necesaria para cualquier otra
    # lógica de Flask que dependa de request.is_secure/request.scheme.
    # Este map respeta el X-Forwarded-Proto entrante si ya viene seteado, y
    # solo cae a "$scheme" cuando no hay nada por delante (local, o el flujo
    # de docs/PRODUCCION.md donde nginx sí sería quien termina TLS). Ojo:
    # como está, confía ciegamente en un X-Forwarded-Proto que llegue de
    # cualquier lado — inofensivo mientras nginx no esté expuesto directo a
    # internet (en Dokploy usa `expose`, no `ports`), pero si el flujo de
    # PRODUCCION.md llega a exponer este nginx directo al público habría que
    # restringir de qué IPs se acepta ese header (ver docs/DOKPLOY.md).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # dify-web/dify-api resueltos por variable (no por `upstream {}` fijo):
    # un `upstream { server dify-api:5001; }` clásico resuelve el hostname
    # UNA sola vez, al arrancar nginx, y cachea esa IP para siempre. Cuando
    # Dokploy redeploya y recrea dify-api/dify-worker (nueva IP) sin
    # recrear también nginx (porque nginx.conf no cambió), nginx sigue
    # apuntando a la IP vieja del contenedor viejo -> 502 Bad Gateway en
    # todo lo que pase por /console/api, /api, /v1, etc. hasta reiniciar
    # nginx a mano. Con `resolver` (DNS embebido de Docker, 127.0.0.11) +
    # una variable en `proxy_pass`, nginx re-resuelve cada `valid=10s` en
    # vez de una sola vez al arrancar. Ver docs/TROUBLESHOOTING.md.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        set $dify_web_upstream dify-web:3000;
        set $dify_api_upstream dify-api:5001;

        location /health {
            access_log off;
            return 200 "healthy";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://$dify_web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /console/api {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://$dify_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
            # El chat preview del workspace usa SSE bajo este prefijo.
            proxy_buffering off;
        }

        location /api {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://$dify_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
        }

        location /v1 {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://$dify_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
            # /v1/chat-messages con response_mode:streaming usa SSE.
            proxy_buffering off;
        }

        location /files {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://$dify_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
        }

        location /socket.io {
            # Colaboración en tiempo real del editor de workflows (cursores,
            # presencia). El cliente vive en dify-web pero el servidor
            # socket.io corre en dify-api (ext_socketio.py, path por
            # defecto "socket.io") — sin este bloque, /socket.io caía en el
            # location / de arriba (proxy a dify-web:3000, que no sirve
            # este path) y el editor quedaba trabado para siempre en
            # "Syncing data". Ver docs/TROUBLESHOOTING.md.
            proxy_pass http://$dify_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
        }

        location /api/chat-streaming {
            proxy_pass http://$dify_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }
    }
}
