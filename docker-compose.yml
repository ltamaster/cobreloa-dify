services:
  init-permissions:
    # dify-api corre como usuario no-root (dify, uid 1001) y nunca hace
    # chown de sus volúmenes; Docker crea volúmenes nuevos como root:root,
    # así que sin este paso dify-api falla al arrancar/crear el tenant con
    # "PermissionDenied ... privkeys/.../private.pem" (ver TROUBLESHOOTING.md).
    # Corre como root (sin `user:` seteado) para poder hacer el chown.
    image: alpine:3
    container_name: dify-init-permissions
    command: ["sh", "-c", "chown -R 1001:1001 /app/data /app/logs"]
    network_mode: "none"
    volumes:
      - dify_data:/app/data
      - dify_logs:/app/logs

  postgres:
    # pgvector/pgvector es un drop-in de postgres:15 (misma versión mayor,
    # mismo formato de datos) con la extensión `vector` ya compilada —
    # necesaria para VECTOR_STORE=pgvector en dify-api (Knowledge Base/RAG).
    # Tag fijo por la misma razón que plugin-daemon: previsibilidad.
    image: pgvector/pgvector:0.8.6-pg15
    container_name: dify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dify_password}
      POSTGRES_DB: ${POSTGRES_DB:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dify-network

  redis:
    image: redis:7-alpine
    container_name: dify-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dify-network

  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    restart: unless-stopped
    # &dify-api-env: compartido con dify-worker más abajo (mismo bloque
    # vía anchor) — una var que solo tenga sentido para el servidor HTTP,
    # o que no debas mandarle al worker, va a llegar a ambos igual.
    environment: &dify-api-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-dify}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dify_password}
      DB_DATABASE: ${POSTGRES_DB:-dify}
      # Sin esto, dify-api arranca contra un schema vacío ("relation
      # ... does not exist"): el entrypoint solo corre `flask upgrade-db`
      # cuando MIGRATION_ENABLED=true.
      MIGRATION_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      REDIS_USE_SSL: "false"
      # Sin esto, Celery cae a su default hardcodeado (amqp://guest@localhost,
      # RabbitMQ) y cualquier chat/ejecución de workflow cuelga para
      # siempre con "Connection refused" — dify-api despacha la ejecución
      # real a una tarea de Celery (workflow_based_app_execution_task),
      # no la corre sincrónicamente. DB 1, separada de la DB 0 de uso
      # general, igual que el compose oficial de Dify. Ver TROUBLESHOOTING.md.
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SQLALCHEMY_SILENCE_UBER_WARNING: 1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAIL_TYPE: ${MAIL_TYPE:-smtp}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-apikey}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_DEFAULT_SEND_FROM: ${MAIL_DEFAULT_SEND_FROM:-noreply@cobreloa.cl}
      # URL pública real (vía nginx) usada para construir links salientes
      # absolutos (invitaciones, reset de password, OAuth) — no el puerto
      # directo de dify-web/dify-api. Ver docs/TROUBLESHOOTING.md.
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-http://localhost}
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost}
      SERVICE_API_URL: ${SERVICE_API_URL:-http://localhost}
      # Sin esto cae al default de la imagen (http://localhost:3000), que
      # no coincide con el origin real del navegador (http://localhost,
      # vía nginx) — el servidor Socket.IO de dify-api (colaboración en
      # tiempo real del editor de workflows) rechaza la conexión con
      # "... is not an accepted origin" y el editor queda trabado en
      # "Syncing data" sin poder editar nada. Ver docs/TROUBLESHOOTING.md.
      CONSOLE_CORS_ALLOW_ORIGINS: ${CONSOLE_CORS_ALLOW_ORIGINS:-http://localhost}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Sin esto, Knowledge Base/RAG falla con "Vector store type is not
      # configured". Reutiliza el mismo Postgres (imagen pgvector/pgvector,
      # ver servicio postgres), no una base separada.
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: 5432
      PGVECTOR_USER: ${POSTGRES_USER:-dify}
      PGVECTOR_PASSWORD: ${POSTGRES_PASSWORD:-dify_password}
      PGVECTOR_DATABASE: ${POSTGRES_DB:-dify}
      # Sin esto, cualquier proveedor de modelo (Anthropic/Claude incluido)
      # falla con "Failed to request plugin daemon": Dify movió los
      # providers a una arquitectura de plugins que corre en un servicio
      # aparte. Las dos claves deben coincidir con las del servicio
      # plugin-daemon (SERVER_KEY / DIFY_INNER_API_KEY) — ver TROUBLESHOOTING.md.
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-change_me_plugin_daemon_key_min_32_chars_1234567890}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-change_me_plugin_inner_api_key_min_32_chars_1234567890}
    volumes:
      - dify_data:/app/data
      - dify_logs:/app/logs
    ports:
      - "${DIFY_API_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
      plugin-daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s
    networks:
      - dify-network

  dify-worker:
    # Misma imagen que dify-api, en MODE=worker: consume la cola de Celery
    # (CELERY_BROKER_URL, ver arriba). Sin este servicio, dify-api encola
    # las tareas correctamente pero nunca hay nadie que las ejecute — el
    # chat/workflow se queda colgado para siempre. Comparte el mismo
    # environment que dify-api vía YAML anchor (&dify-api-env) para no
    # duplicar ~25 variables que tienen que coincidir entre ambos.
    image: langgenius/dify-api:latest
    container_name: dify-worker
    restart: unless-stopped
    environment:
      <<: *dify-api-env
      MODE: worker
    volumes:
      - dify_data:/app/data
      - dify_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
      plugin-daemon:
        condition: service_healthy
    networks:
      - dify-network

  plugin-daemon:
    # Tag fijo (no ":latest": esta imagen no publica ese tag) — usamos el
    # mismo que pinea el docker-compose.yaml oficial de Dify al momento de
    # escribir esto.
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: dify-plugin-daemon
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-dify}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dify_password}
      # Base separada de la de dify-api, fija (no interpolada): el nombre
      # tiene que coincidir con postgres/init/01-create-plugin-db.sql, que
      # también lo tiene hardcodeado.
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      REDIS_USE_SSL: "false"
      SERVER_PORT: 5002
      # Debe coincidir con PLUGIN_DAEMON_KEY del servicio dify-api.
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-change_me_plugin_daemon_key_min_32_chars_1234567890}
      DIFY_INNER_API_URL: http://dify-api:5001
      # Debe coincidir con INNER_API_KEY_FOR_PLUGIN del servicio dify-api.
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-change_me_plugin_inner_api_key_min_32_chars_1234567890}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      # Plugins del marketplace oficial vienen firmados; dejarlo en true
      # (default de Dify) los verifica. Poné esta en false solo si vas a
      # instalar plugins locales/no firmados durante desarrollo.
      FORCE_VERIFYING_SIGNATURE: ${PLUGIN_FORCE_VERIFYING_SIGNATURE:-true}
    volumes:
      - dify_plugin_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5002/health/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dify-network

  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web
    restart: unless-stopped
    environment:
      # CONSOLE_API_URL/APP_API_URL en blanco -> el navegador usa rutas
      # relativas (/console/api, /api) resueltas contra el origin de nginx
      # que sirvió la página. NO poner aquí el hostname interno de Docker:
      # ese mismo valor se hornea también en el bundle del navegador
      # (son variables NEXT_PUBLIC_*), y el navegador no puede resolver
      # "dify-api". SERVER_CONSOLE_API_URL es la variable que sí lee el
      # SSR (corre dentro del propio contenedor dify-web, donde localhost
      # apunta a sí mismo, no a dify-api) — ver docs/TROUBLESHOOTING.md.
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      SERVER_CONSOLE_API_URL: "http://dify-api:5001"
    # Sin publicar al host a propósito: acceder directo a :3000 (bypaseando
    # nginx) rompe las rutas relativas de arriba — en vez de fallar de
    # forma confusa, que falle con "connection refused" de una. nginx
    # llega a dify-web por la red interna de Docker (dify-network), no
    # necesita este puerto publicado. Ver docs/TROUBLESHOOTING.md.
    depends_on:
      dify-api:
        condition: service_healthy
    healthcheck:
      # dify-web escucha en la IP del contenedor (su $HOSTNAME), no en
      # localhost/0.0.0.0 — "wget ... localhost:3000" nunca conecta.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://$$HOSTNAME:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dify-network

  nginx:
    image: nginx:alpine
    container_name: dify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      dify-web:
        condition: service_healthy
      dify-api:
        condition: service_healthy
    healthcheck:
      # "localhost" resuelve primero a ::1 en este contenedor y nginx solo
      # escucha en IPv4 -> "connection refused"; forzamos 127.0.0.1.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dify-network

volumes:
  postgres_data:
  redis_data:
  dify_data:
  dify_logs:
  dify_plugin_storage:

networks:
  dify-network:
    driver: bridge