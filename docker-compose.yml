version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dify_password}
      POSTGRES_DB: ${POSTGRES_DB:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dify-network

  redis:
    image: redis:7-alpine
    container_name: dify-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dify-network

  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-dify}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dify_password}
      DB_DATABASE: ${POSTGRES_DB:-dify}
      # Sin esto, dify-api arranca contra un schema vacío ("relation
      # ... does not exist"): el entrypoint solo corre `flask upgrade-db`
      # cuando MIGRATION_ENABLED=true.
      MIGRATION_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      REDIS_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SQLALCHEMY_SILENCE_UBER_WARNING: 1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAIL_TYPE: ${MAIL_TYPE:-smtp}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-apikey}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_DEFAULT_SEND_FROM: ${MAIL_DEFAULT_SEND_FROM:-noreply@cobreloa.cl}
      # URL pública real (vía nginx) usada para construir links salientes
      # absolutos (invitaciones, reset de password, OAuth) — no el puerto
      # directo de dify-web/dify-api. Ver docs/TROUBLESHOOTING.md.
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-http://localhost}
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost}
      SERVICE_API_URL: ${SERVICE_API_URL:-http://localhost}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - dify_data:/app/data
      - dify_logs:/app/logs
    ports:
      - "${DIFY_API_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s
    networks:
      - dify-network

  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web
    restart: unless-stopped
    environment:
      # No reutilizar CONSOLE_API_URL de .env (esa es la URL pública que
      # usa dify-api para mostrar links). El SSR de dify-web corre dentro
      # de SU PROPIO contenedor: localhost ahí apunta a dify-web, no a
      # dify-api, y esta imagen exige una URL absoluta (falla con "Server
      # console API URL is not configured" si se deja en blanco), así que
      # se usa el nombre de servicio Docker interno. El navegador sigue
      # usando rutas relativas (/console/api, /api, /v1, /files)
      # resueltas contra el origin de nginx — ver docs/TROUBLESHOOTING.md.
      CONSOLE_API_URL: "http://dify-api:5001"
      APP_API_URL: "http://dify-api:5001"
    ports:
      - "${DIFY_WEB_PORT:-3000}:3000"
    depends_on:
      dify-api:
        condition: service_healthy
    healthcheck:
      # dify-web escucha en la IP del contenedor (su $HOSTNAME), no en
      # localhost/0.0.0.0 — "wget ... localhost:3000" nunca conecta.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://$$HOSTNAME:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dify-network

  nginx:
    image: nginx:alpine
    container_name: dify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      dify-web:
        condition: service_healthy
      dify-api:
        condition: service_healthy
    healthcheck:
      # "localhost" resuelve primero a ::1 en este contenedor y nginx solo
      # escucha en IPv4 -> "connection refused"; forzamos 127.0.0.1.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dify-network

volumes:
  postgres_data:
  redis_data:
  dify_data:
  dify_logs:

networks:
  dify-network:
    driver: bridge