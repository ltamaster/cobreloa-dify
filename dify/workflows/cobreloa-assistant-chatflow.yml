    value: '0'
    description: 0 = no verificado, 1 = verificado (string para el assigner)
    selector: &id001
    - conversation
    - verified
  - id: 0a1b2c3d-4e5f-6789-abcd-ef0123456789
    name: otp_code
    value_type: string
    value: ''
    description: Codigo OTP enviado al socio, para validar en el siguiente turno
    selector:
    - conversation
