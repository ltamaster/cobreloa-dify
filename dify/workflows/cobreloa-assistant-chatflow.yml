app:
  name: Cobreloa - Asistente (Chatflow)
  description: Chatflow del asistente de membresia de Cobreloa. Usa Environment Variables para URLs/tokens de integraciones y Conversation Variables para el estado de sesion. Clasifica la intencion y enruta a cada flujo.
  icon: 🟠
  icon_background: '#FFEAD5'
  mode: advanced-chat
kind: app
version: 0.1.5
workflow:
  environment_variables:
  - id: 8502f2fd-273f-4121-9c47-9c7b4ba841f3
    name: MEMBREZIA_API_URL
    value: http://wiremock:8080/api/v1
    value_type: string
  - id: dd8fe6c7-7d6a-4066-851c-6f617b99fccf
    name: MEMBREZIA_API_TOKEN
    value: ''
    value_type: secret
  - id: 9fe2b4c0-8181-450a-8172-41a7c38ae39e
    name: RESEND_API_KEY
    value: ''
    value_type: secret
  - id: 7116c96a-f36d-4fc4-ade0-d082071a2b2c
    name: MERCADOPAGO_ACCESS_TOKEN
    value: ''
    value_type: secret
  - id: 771111a9-0eb6-4563-ba36-61106d93eda5
    name: SLACK_WEBHOOK_URL
    value: ''
    value_type: secret
  - id: 0ca21f9b-2d52-4035-b209-298c5b720bde
    name: SOCIOS_PORTAL_URL
    value: https://socios.cobreloa.cl
    value_type: string
  - id: 438f37bc-a6c5-425b-a814-eef233334ca2
    name: SUPPORT_EMAIL
    value: soporte@cobreloa.cl
    value_type: string
  - id: 383490e0-f1db-432c-8092-8b7693d7df44
    name: SCHOOLS_EMAIL
    value: escuelas@cobreloa.cl
    value_type: string
  conversation_variables:
  - id: b7152b26-e556-4bda-8fdf-0102192fb664
    name: user_rut
    value_type: string
    value: ''
    description: ''
    selector:
    - conversation
    - user_rut
  - id: 2e455fd5-dada-4c57-b87e-d96730218a3e
    name: user_email
    value_type: string
    value: ''
    description: ''
    selector:
    - conversation
    - user_email
