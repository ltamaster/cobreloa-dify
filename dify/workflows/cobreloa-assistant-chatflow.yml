        y: 340
      width: 244
      height: 220
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: Clasificador de intencion
        desc: ''
        type: question-classifier
        selected: false
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0
        classes:
        - id: '1'
          name: Estado de socio (consultar plan, proximo pago, beneficios)
        - id: '2'
          name: Hacerse socio (planes y precios, quiere inscribirse)
        - id: '3'
          name: Pagar la cuota (metodos de pago)
        - id: '4'
          name: Escuelas de futbol (categorias, inscribir a un menor)
        - id: '5'
          name: Informacion general (horarios, sede, FAQs)
        - id: '6'
          name: Hablar con soporte / escalar a un humano
        - id: '7'
          name: Otro / fuera de alcance
        query_variable_selector:
        - sys
        - query
        instruction: Clasifica la consulta del socio en una de las intenciones. Si no corresponde a la membresia de Cobreloa, usa 'Otro'.
        vision:
          enabled: false
        topics: []
    - id: code_auth
      type: custom
      position:
        x: 700
        y: -140
      positionAbsolute:
        x: 700
        y: -140
      width: 244
      height: 54
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: Estado auth (parse + OTP)
        desc: Extrae RUT o codigo, genera/valida OTP y decide la etapa
        type: code
        selected: false
        code_language: python3
        code: "import re\nimport random\n\ndef main(query, rut_saved, otp_saved, verified):\n    q = query or \"\"\n    is_verified = str(verified) in (\"1\", \"1.0\", \"True\", \"true\")\n    if is_verified:\n        return {\"stage\": \"verified\", \"rut\": rut_saved or \"\", \"new_otp\": \"\"}\n    rut_m = re.search(r\"(\\d{1,2}\\.?\\d{3}\\.?\\d{3}-[\\dkK])\", q)\n    code_m = re.search(r\"(?<!\\d)(\\d{6})(?!\\d)\", q)\n    if otp_saved:\n        if code_m and code_m.group(1) == str(otp_saved):\n            return {\"stage\": \"verify_ok\", \"rut\": rut_saved or \"\", \"new_otp\": \"\"}\n        if code_m:\n            return {\"stage\": \"verify_fail\", \"rut\": rut_saved or \"\", \"new_otp\": \"\"}\n        return {\"stage\": \"awaiting_code\", \"rut\": rut_saved or \"\", \"new_otp\": \"\"}\n    if rut_m:\n        rut = rut_m.group(1).replace(\".\", \"\")\n        otp = \"%06d\" % random.randint(0, 999999)\n        return {\"stage\": \"send_code\", \"rut\": rut, \"new_otp\": otp}\n    return {\"stage\": \"need_rut\", \"rut\": \"\", \"new_otp\": \"\"}\n"
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: rut_saved
          value_selector:
          - conversation
          - user_rut
        - variable: otp_saved
          value_selector:
          - conversation
          - otp_code
        - variable: verified
          value_selector:
          - conversation
          - verified
        outputs:
          stage:
            type: string
          rut:
            type: string
          new_otp:
            type: string
    - id: router_auth
      type: custom
      position:
        x: 1000
        y: -140
      positionAbsolute:
        x: 1000
        y: -140
      width: 244
      height: 260
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: Router de etapa
        desc: ''
        type: if-else
        selected: false
        isInIteration: false
        isInLoop: false
        cases:
        - case_id: need_rut
          logical_operator: and
          conditions:
          - id: cond_need_rut
            varType: string
            variable_selector:
            - code_auth
            - stage
            comparison_operator: is
            value: need_rut
        - case_id: send_code
          logical_operator: and
          conditions:
          - id: cond_send_code
            varType: string
            variable_selector:
            - code_auth
            - stage
            comparison_operator: is
            value: send_code
        - case_id: awaiting_code
          logical_operator: and
          conditions:
          - id: cond_awaiting_code
            varType: string
            variable_selector:
            - code_auth
            - stage
            comparison_operator: is
            value: awaiting_code
        - case_id: verify_fail
          logical_operator: and
          conditions:
          - id: cond_verify_fail
            varType: string
            variable_selector:
            - code_auth
            - stage
            comparison_operator: is
            value: verify_fail
        - case_id: verify_ok
          logical_operator: and
          conditions:
          - id: cond_verify_ok
            varType: string
            variable_selector:
            - code_auth
            - stage
            comparison_operator: is
            value: verify_ok
